name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Package VSIX
        run: npm run package

      - name: Inspect VSIX contents
        run: npx vsce ls

      - name: Run extension-host tests
        run: xvfb-run -a npm run test:integration

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: shuck-vsix
          path: shuck-*.vsix
          if-no-files-found: error
