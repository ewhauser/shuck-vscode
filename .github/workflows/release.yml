name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Validate
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:unit

      - name: Package VSIX
        run: npm run package

      - name: Inspect VSIX contents
        run: npx vsce ls

      - name: Upload VSIX to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          gh release upload "$RELEASE_TAG" "shuck-$package_version.vsix" --clobber

      - name: Publish to Visual Studio Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --packagePath "shuck-$(node -p 'require("./package.json").version').vsix" --pat "$VSCE_PAT"
